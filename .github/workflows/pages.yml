name: Deploy to GitHub Pages

# Builds `main` and deploys it to https://ls11ae.github.io/ruler-of-the-plane/.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Build variables come from Settings → Secrets and variables → Actions → Variables (see .env.example).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check and build
        run: npm run check
        env:
          VITE_STAFF_PIN: ${{ vars.VITE_STAFF_PIN }}
          VITE_TSP_BOARDS_URL: ${{ vars.VITE_TSP_BOARDS_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
